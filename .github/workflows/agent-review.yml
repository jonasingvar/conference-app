## A second agent reads the pull request the first one just opened.
##
## It starts from the issue's acceptance criteria, not the diff, and it has
## never seen the reasoning that produced the change — which is the whole
## point. The agent that built it cannot see its own misreading.
##
## It comments and never blocks. A human merges.
##
## Triggered by the build workflow finishing rather than by the pull request
## opening or the `ready-for-human` label landing: both of those are done with
## GITHUB_TOKEN, and GitHub does not fire workflows from that.
name: Agent · review

on:
  workflow_run:
    workflows: ["Agent · build"]
    types: [completed]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    # Nothing to review if the build never produced a pull request.
    if: >-
      github.event_name == 'pull_request' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      pull-requests: write
      issues: read
      checks: write         # publish the verdict as a check on the PR
      id-token: write
      actions: read

    steps:
      - name: Work out which pull request this is
        id: pr
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            number="${{ github.event.pull_request.number }}"
            sha="${{ github.event.pull_request.head.sha }}"
            ref="${{ github.event.pull_request.head.ref }}"
          else
            number=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
            sha="${{ github.event.workflow_run.head_sha }}"
            ref="$BRANCH"
          fi
          {
            echo "number=$number"
            echo "sha=$sha"
            echo "ref=$ref"
          } >> "$GITHUB_OUTPUT"
          [ -n "$number" ] || echo "No open pull request — the build stopped at needs-human."

      - uses: actions/checkout@v7
        if: steps.pr.outputs.number != ''
        with:
          ref: ${{ steps.pr.outputs.ref }}
          fetch-depth: 0        # the review reads the diff against main

      - uses: actions/setup-node@v7
        if: steps.pr.outputs.number != ''
        with:
          node-version: 22
          cache: npm

      - uses: anthropics/claude-code-action@v1
        if: steps.pr.outputs.number != ''
        # The agent crashing is not the same as the change being wrong; its
        # verdict is the signal, and the step below is what acts on it.
        continue-on-error: true
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.AGENT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          prompt: "/review ${{ steps.pr.outputs.number }}"
          claude_args: >-
            --model claude-opus-5 --max-turns 40
            --allowedTools "Bash,Read,Glob,Grep"

      # Red means a blocker was found, not that merging is forbidden — nothing
      # here is a required check. It puts the blocker where a skim-reader sees
      # it instead of three comments down.
      - name: Publish the verdict
        if: ${{ !cancelled() && steps.pr.outputs.number != '' }}
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ steps.pr.outputs.sha }}
        run: |
          verdict=$(head -c 200 /tmp/review-verdict 2>/dev/null | tr -d '\n' || true)
          case "$verdict" in
            PASS*) conclusion=success; summary="No blockers." ;;
            FAIL*) conclusion=failure; summary="${verdict#FAIL}" ;;
            *)     conclusion=neutral; summary="Review did not finish — no verdict written." ;;
          esac

          gh api "repos/$GH_REPO/check-runs" \
            -f name='Agent · review' \
            -f head_sha="$SHA" \
            -f status=completed \
            -f conclusion="$conclusion" \
            -f "output[title]=Fresh-context review" \
            -f "output[summary]=${summary:-see the pull request comment}" \
            --silent

          echo "verdict: ${verdict:-<none>} → $conclusion"
          [ "$conclusion" != "failure" ]
