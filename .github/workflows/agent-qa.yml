## An agent that tries to break the change, in a browser, after it passed.
##
## The suite being green is the gate; this is the pass that goes looking for
## what nobody wrote a test for — the empty agenda, the phone viewport, the
## fourth day, the second click. It boots the app and drives it.
##
## Unlike the review, **this one can stop a merge.** A reproducible bug is not
## advice. The agent writes a verdict, a shell step turns it into a check run
## on the pull request, and branch protection can require it.
##
## Triggered by the pull request itself. An earlier version keyed off the build
## workflow finishing, which does not work: a build started by an `issues`
## event reports `head_branch` as `main`, so the lookup for its pull request
## found nothing and these passes never ran.
name: Agent · QA

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A new commit makes the pass already running pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: read
      pull-requests: write
      issues: read
      checks: write         # publish the verdict as a check on the PR
      id-token: write
      actions: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

        run: npm ci

      # This pass is the browser. Without it there is nothing to drive.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - uses: anthropics/claude-code-action@v1
        # The agent failing is not the same as the change failing. Its verdict
        # is the signal, and the step below is what acts on it.
        continue-on-error: true
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.AGENT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          prompt: |
            /qa ${{ github.event.pull_request.number }}

            Finish by writing /tmp/qa-verdict — "PASS" or "FAIL <one line>".
            Without that file this run reports as unproven rather than as your verdict.
          claude_args: >-
            --model claude-opus-5 --max-turns 60
            --allowedTools "Bash,Read,Write,Glob,Grep"
        env:
          NO_OPEN: "1"

      # The verdict is a file the agent writes, not a mood. No file means the
      # pass did not finish, which is not the same as finding nothing — say so
      # rather than quietly passing.
      - name: Publish the verdict
        if: ${{ !cancelled() }}
        env:
          # Check runs can only be created by a GitHub App. GITHUB_TOKEN is
          # one; a personal access token is not, and the API rejects it — so
          # this step does not take the AGENT_GITHUB_TOKEN the others use.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          verdict=$(head -c 200 /tmp/qa-verdict 2>/dev/null | tr -d '\n' || true)
          case "$verdict" in
            PASS*)  conclusion=success; summary="Exploratory pass found nothing that blocks." ;;
            FAIL*)  conclusion=failure; summary="${verdict#FAIL}" ;;
            *)      conclusion=neutral; summary="QA did not finish — no verdict written. Treat as unproven." ;;
          esac

          gh api "repos/$GH_REPO/check-runs" \
            -f name='Agent · QA' \
            -f head_sha="$SHA" \
            -f status=completed \
            -f conclusion="$conclusion" \
            -f "output[title]=Exploratory QA" \
            -f "output[summary]=${summary:-see the pull request comment}" \
            --silent

          echo "verdict: ${verdict:-<none>} → $conclusion"
          [ "$conclusion" != "failure" ]
