## An agent that tries to break the change, in a browser, after it passed.
##
## The suite being green is the gate; this is the pass that goes looking for
## what nobody wrote a test for — the empty agenda, the phone viewport, the
## fourth day, the second click. It boots the app and drives it.
##
## Unlike the review, **this one can stop a merge.** A reproducible bug is not
## advice. The agent writes a verdict, a shell step turns it into a check run
## on the pull request, and branch protection can require it.
##
## Two triggers, because agent pull requests and human ones arrive differently:
## an agent opens its pull request with GITHUB_TOKEN, and GitHub will not fire
## `pull_request` from that — so those come in on the build finishing instead.
name: Agent · QA

on:
  workflow_run:
    workflows: ["Agent · build"]
    types: [completed]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# An agent's pull request can arrive by both routes — the build finishing and
# the pull request opening. One agent pass per commit is enough, and at these
# prices two is worth preventing rather than tolerating.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  qa:
    if: >-
      github.event_name == 'pull_request' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: read
      pull-requests: write
      issues: read
      checks: write         # publish the verdict as a check on the PR
      id-token: write
      actions: read

    steps:
      - name: Work out which pull request this is
        id: pr
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            number="${{ github.event.pull_request.number }}"
            sha="${{ github.event.pull_request.head.sha }}"
            ref="${{ github.event.pull_request.head.ref }}"
          else
            number=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
            sha="${{ github.event.workflow_run.head_sha }}"
            ref="$BRANCH"
          fi
          {
            echo "number=$number"
            echo "sha=$sha"
            echo "ref=$ref"
          } >> "$GITHUB_OUTPUT"
          [ -n "$number" ] || echo "No open pull request — nothing to exercise."

      - uses: actions/checkout@v7
        if: steps.pr.outputs.number != ''
        with:
          ref: ${{ steps.pr.outputs.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        if: steps.pr.outputs.number != ''
        with:
          node-version: 22
          cache: npm

      - if: steps.pr.outputs.number != ''
        run: npm ci

      # This pass is the browser. Without it there is nothing to drive.
      - name: Install Chromium
        if: steps.pr.outputs.number != ''
        run: npx playwright install --with-deps chromium

      - uses: anthropics/claude-code-action@v1
        if: steps.pr.outputs.number != ''
        # The agent failing is not the same as the change failing. Its verdict
        # is the signal, and the step below is what acts on it.
        continue-on-error: true
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.AGENT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          prompt: |
            /qa ${{ steps.pr.outputs.number }}

            Finish by writing /tmp/qa-verdict — "PASS" or "FAIL <one line>".
            Without that file this run reports as unproven rather than as your verdict.
          claude_args: >-
            --model claude-opus-5 --max-turns 60
            --allowedTools "Bash,Read,Write,Glob,Grep"
        env:
          NO_OPEN: "1"

      # The verdict is a file the agent writes, not a mood. No file means the
      # pass did not finish, which is not the same as finding nothing — say so
      # rather than quietly passing.
      - name: Publish the verdict
        if: ${{ !cancelled() && steps.pr.outputs.number != '' }}
        env:
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ steps.pr.outputs.sha }}
        run: |
          verdict=$(head -c 200 /tmp/qa-verdict 2>/dev/null | tr -d '\n' || true)
          case "$verdict" in
            PASS*)  conclusion=success; summary="Exploratory pass found nothing that blocks." ;;
            FAIL*)  conclusion=failure; summary="${verdict#FAIL}" ;;
            *)      conclusion=neutral; summary="QA did not finish — no verdict written. Treat as unproven." ;;
          esac

          gh api "repos/$GH_REPO/check-runs" \
            -f name='Agent · QA' \
            -f head_sha="$SHA" \
            -f status=completed \
            -f conclusion="$conclusion" \
            -f "output[title]=Exploratory QA" \
            -f "output[summary]=${summary:-see the pull request comment}" \
            --silent

          echo "verdict: ${verdict:-<none>} → $conclusion"
          [ "$conclusion" != "failure" ]
